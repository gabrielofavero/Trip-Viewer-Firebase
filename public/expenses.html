<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link data-main href="assets/css/expenses/expenses.css" rel="stylesheet">

</head>

<body>
  <div id="expenses-content" class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <div class="section-title">
      <br><br><br><br>
      <h2 data-translate="trip.expenses.title"></h2>
    </div>

    <div id="gastos-container">
      <div class="tabs-container">
        <div class="tabs" id="tab-moedas" style="display: none;">
        </div>
      </div>
      <div class="tabs-container" id="tabs-container-gastos">
        <div class="tabs" id="tab-gastos" style="display: none;">
          <input type="radio" style="display: none;" id="radio-resumo" name="tabs-gastos" checked />
          <label class="tab" for="radio-resumo" data-translate="labels.overview"></label>
          <input type="radio" style="display: none;" id="radio-gastosPrevios" name="tabs-gastos" />
          <label class="tab" for="radio-gastosPrevios" data-translate="trip.expenses.min.pre_trip"></label>
          <input type="radio" style="display: none;" id="radio-gastosDurante" name="tabs-gastos" />
          <label class="tab" for="radio-gastosDurante" data-translate="trip.expenses.min.during_trip"></label>
          <input type="radio" style="display: none;" id="radio-gastosViajantes" name="tabs-gastos" />
          <label class="tab" for="radio-gastosViajantes" data-translate="trip.travelers.title"></label>
          <span class="glider"></span>
        </div>
      </div>
    </div>

    <div>
      <div id="conversao"></div>
      <div id="resumo" class="main-container">
        <div id="resumo-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="resumo-titulo" class="gastos-titulo" data-translate="labels.overview"></h2>
            <div id="resumo-total" class="gastos-subtitulo"></div>
            <canvas id="resumo-grafico" width="300" height="300"></canvas>
          </div>

          <div id="resumo-gastosPrevios" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="resumo-gastosPrevios-titulo" data-translate="trip.expenses.pre_trip"></h2>
            <table id="resumo-gastosPrevios-tabela" class="card-full-size">
            </table>
          </div>

          <div id="resumo-gastosDurante" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="resumo-gastosDurante-titulo" data-translate="trip.expenses.during_trip"></h2>
            <table id="resumo-gastosDurante-tabela" class="card-full-size">
            </table>
          </div>

          <div id="resumo-gastosViajantes" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="resumo-gastosViajantes-titulo" data-translate="trip.travelers.title"></h2>
            <table id="resumo-gastosViajantes-tabela" class="card-full-size">
            </table>
          </div>
        </div>
      </div>
      <div id="gastosPrevios" class="main-container" style="display: none">
        <div id="gastosPrevios-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="gastosPrevios-titulo" class="gastos-titulo" data-translate="trip.expenses.pre_trip"></h2>
            <div id="gastosPrevios-total" class="gastos-subtitulo"></div>
            <canvas id="gastosPrevios-grafico" style="margin-top: 16px;" width="300" height="150"></canvas>
          </div>
        </div>
      </div>
      <div id="gastosDurante" class="main-container" style="display: none">
        <div id="gastosDurante-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="gastosDurante-titulo" class="gastos-titulo" data-translate="trip.expenses.during_trip"></h2>
            <div id="gastosDurante-total" class="gastos-subtitulo"></div>
            <canvas id="gastosDurante-grafico" style="margin-top: 16px;" width="150" height="75"></canvas>
          </div>
        </div>
      </div>
      <div id="gastosViajantes" class="main-container" style="display: none">
        <div id="gastosViajantes-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="gastosViajantes-titulo" class="gastos-titulo" data-translate="trip.travelers.title"></h2>
            <div id="gastosViajantes-total" class="gastos-subtitulo"></div>
            <canvas id="gastosViajantes-grafico" style="margin-top: 16px;" width="300" height="150"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= Footer ======= -->
  <footer class="footer">
    <div class="container">
      <div class="credits">
        <span data-translate="labels.developed_by"></span> <a href="https://www.linkedin.com/in/gabrielfavero/">Gabriel
          Fávero</a>. <span class="attributions" onclick="_openAttributions()"><i class="iconify"
            data-icon="ri:information-line"></i>
          <span data-translate="labels.credits"></span></span>
      </div>
    </div>
  </footer>

  <!-- ======= Support: Preloader ======= -->
  <div id="preloader"></div>

  <!-- #include shared/scripts-vendor.html -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
  <!-- #include shared/scripts-core.html -->

</body>

</html>
