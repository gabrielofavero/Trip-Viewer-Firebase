<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link data-main href="assets/css/expenses/expenses.css" rel="stylesheet">

</head>

<body>
  <div id="expenses-content" class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <div class="section-title">
      <br><br><br><br>
      <h2 data-translate="trip.expenses.title"></h2>
    </div>

    <div id="gastos-container">
      <div class="tabs-container">
        <div class="tabs" id="tab-moedas" style="display: none;">
        </div>
      </div>
      <div class="tabs-container" id="tabs-container-expenses">
        <div class="tabs" id="tab-expenses" style="display: none;">
          <input type="radio" style="display: none;" id="radio-resumo" name="tabs-expenses" checked />
          <label class="tab" for="radio-resumo" data-translate="labels.overview"></label>
          <input type="radio" style="display: none;" id="radio-preTrip" name="tabs-expenses" />
          <label class="tab" for="radio-preTrip" data-translate="trip.expenses.min.pre_trip"></label>
          <input type="radio" style="display: none;" id="radio-duringTrip" name="tabs-expenses" />
          <label class="tab" for="radio-duringTrip" data-translate="trip.expenses.min.during_trip"></label>
          <input type="radio" style="display: none;" id="radio-expensesTravelers" name="tabs-expenses" />
          <label class="tab" for="radio-expensesTravelers" data-translate="trip.travelers.title"></label>
          <span class="glider"></span>
        </div>
      </div>
    </div>

    <div>
      <div id="conversao"></div>
      <div id="resumo" class="main-container">
        <div id="resumo-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="resumo-titulo" class="gastos-titulo" data-translate="labels.overview"></h2>
            <div id="resumo-total" class="gastos-subtitulo"></div>
            <canvas id="resumo-grafico" width="300" height="300"></canvas>
          </div>

          <div id="summary-preTrip" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="summary-preTrip-title" data-translate="trip.expenses.pre_trip"></h2>
            <table id="summary-preTrip-table" class="card-full-size">
            </table>
          </div>

          <div id="summary-duringTrip" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="summary-duringTrip-title" data-translate="trip.expenses.during_trip"></h2>
            <table id="summary-duringTrip-table" class="card-full-size">
            </table>
          </div>

          <div id="summary-expensesTravelers" class="gastos-card gastos-recibo" style="display: none;">
            <h2 class="gastos-titulo" id="summary-expensesTravelers-title" data-translate="trip.travelers.title"></h2>
            <table id="summary-expensesTravelers-table" class="card-full-size">
            </table>
          </div>
        </div>
      </div>
      <div id="preTrip" class="main-container" style="display: none">
        <div id="preTrip-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="preTrip-title" class="gastos-titulo" data-translate="trip.expenses.pre_trip"></h2>
            <div id="preTrip-total" class="gastos-subtitulo"></div>
            <canvas id="preTrip-chart" style="margin-top: 16px;" width="300" height="150"></canvas>
          </div>
        </div>
      </div>
      <div id="duringTrip" class="main-container" style="display: none">
        <div id="duringTrip-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="duringTrip-title" class="gastos-titulo" data-translate="trip.expenses.during_trip"></h2>
            <div id="duringTrip-total" class="gastos-subtitulo"></div>
            <canvas id="duringTrip-chart" style="margin-top: 16px;" width="150" height="75"></canvas>
          </div>
        </div>
      </div>
      <div id="expensesTravelers" class="main-container" style="display: none">
        <div id="expensesTravelers-container" class="gastos-container">
          <div class="gastos-card grafico">
            <h2 id="expensesTravelers-title" class="gastos-titulo" data-translate="trip.travelers.title"></h2>
            <div id="expensesTravelers-total" class="gastos-subtitulo"></div>
            <canvas id="expensesTravelers-chart" style="margin-top: 16px;" width="300" height="150"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= Footer ======= -->
  <footer class="footer">
    <div class="container">
      <div class="credits">
        <span data-translate="labels.developed_by"></span> <a href="https://www.linkedin.com/in/gabrielfavero/">Gabriel
          Fávero</a>. <span class="attributions" data-action="open-attributions"><i class="iconify"
            data-icon="ri:information-line"></i>
          <span data-translate="labels.credits"></span></span>
      </div>
    </div>
  </footer>

  <!-- ======= Support: Preloader ======= -->
  <div id="preloader"></div>

  <!-- #include shared/scripts-vendor.html -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
  <!-- #include shared/scripts-core.html -->

</body>

</html>
