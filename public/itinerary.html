<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link data-main href="assets/css/itinerary/itinerary.css" rel="stylesheet">

</head>

<body>
  <div class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <!-- ======= Mobile Drawer ======= -->
    <header id="header" class="d-flex flex-column justify-content-center">
      <nav id="navbar" class="navbar nav-menu">
        <ul>
          <li>
            <a href="#" class="nav-link" id="mobile-night-mode">
              <i class="bx bx-moon"></i>
              <span data-translate="labels.dark_mode" id="mobile-night-mode-label"></span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" id="mobile-export">
              <i class="iconify" data-icon="ph:export-bold"></i>
              <span data-translate="labels.export"></span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" id="mobile-print">
              <i class="iconify" data-icon="lucide:printer"></i>
              <span data-translate="labels.print"></span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="section-title">
      <h1 id="title"></h1>
    </div>

    <div class="content-container">
      <div class="content" id="content">
        <div class="preloader"></div>
      </div>
    </div>
  </div>

  <!-- ======= Footer ======= -->
  <footer class="footer">
    <div class="container">
      <div class="credits">
        <span data-translate="labels.developed_by"></span> <a href="https://www.linkedin.com/in/gabrielfavero/">Gabriel
          Fávero</a>. <span class="attributions" data-action="open-attributions"><i class="iconify"
            data-icon="ri:information-line"></i>
          <span data-translate="labels.credits"></span></span>
      </div>
    </div>
  </footer>

  <!-- ======= Support: Preloader ======= -->
  <div class="preloader" id="preloader"></div>

  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" data-action="close-toast">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- #include shared/scripts-vendor.html -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
  <!-- #include shared/scripts-core.html -->

  <!-- #include shared/nav-helper.html -->
</body>

</html>
