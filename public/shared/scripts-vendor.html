<!--
  Shared vendor scripts — included at build time by scripts/inject-partials.js
  Placeholders:
    {{ASSET_PREFIX}} — empty for root pages, "../" for edit/ pages

  NOTE: Firebase SDK version standardized to 10.12.2 across all pages.
  Pages that need additional vendor scripts (Chart.js, TikTok embed, etc.)

<script defer src="/__/firebase/10.12.2/firebase-storage-compat.js"></script>
<script defer src="/__/firebase/init.js?useEmulator=true"></script>
<script type="module" src="{{ASSET_PREFIX}}index.js"></script>
