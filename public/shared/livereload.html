<!--
  Live-reload polling script — only active on localhost.
  Polls /reload for timestamp changes; refreshes the page when a rebuild is detected.
-->
<script>
(function () {
  if (!/localhost|127\.0\.0\.1|^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)) return;
  var last = null;
  setInterval(function () {
    fetch('/reload', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('not ready');
        return r.text();
      })
      .then(function (ts) {
        // /reload holds a millisecond timestamp (digits only). During a
        // rebuild dist/ is wiped first, so /reload can briefly return the
        // hosting 404 ("Cannot GET /reload") or the SPA rewrite (HTML) —
        // neither is a timestamp, and reloading then lands on a blank page.
        if (!/^\d+$/.test(ts)) return;
        if (last !== null && last !== ts) location.reload();
        last = ts;
      })
      .catch(function () { /* server not ready yet */ });
  }, 800);
})();
</script>
