<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link data-main href="assets/css/view/view.css" rel="stylesheet">

</head>

<body>
  <div class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <!-- ======= Header ======= -->
    <header id="header" class="d-flex flex-column justify-content-center">
      <nav id="navbar" class="navbar nav-menu">
        <ul>

          <li>
            <a href="#hero" class="nav-link scrollto active">
              <i class="bx bx-home"></i>
              <span>Home</span>
            </a>
          </li>

          <li id="keypointsNav">
            <a href="#keypoints" class="nav-link scrollto">
              <i class="bx bx-dots-horizontal-rounded"></i>
              <span data-translate="labels.highlights"></span>
            </a>
          </li>

          <li id="expensesNav">
            <a href="#expenses" class="nav-link scrollto">
              <i class="iconify" data-icon="mdi:dollar"></i>
              <span data-translate="trip.expenses.title"></span>
            </a>
          </li>

          <li id="transportationNav">
            <a href="#transportation" class="nav-link scrollto">
              <i class="iconify" data-icon="mingcute:rocket-fill"></i>
              <span data-translate="trip.transportation.title"></span>
            </a>
          </li>

          <li id="stayNav">
            <a href="#stay" class="nav-link scrollto">
              <i class="bx bxs-hotel"></i>
              <span data-translate="trip.accommodation.title"></span>
            </a>
          </li>

          <li id="scheduleCalendarNav">
            <a href="#scheduleCalendar" class="nav-link scrollto">
              <i class="bx bx-calendar"></i>
              <span data-translate="trip.itinerary.title"></span>
            </a>
          </li>

          <li id="destinationsNav">
            <a href="#destinations" class="nav-link scrollto">
              <i class="bx bx-map"></i>
              <span id="destinationsNavText" data-translate="destination.title"></span>
            </a>
          </li>

          <li id="portfolioM">
            <a href="#portfolio" class="nav-link scrollto">
              <i class="bx bx-photo-album"></i>
              <span data-translate="trip.gallery.title"></span>
            </a>
          </li>

        </ul>
      </nav>

    </header>

    <!-- ======= Hero ======= -->
    <section id="hero" class="d-flex flex-column justify-content-center">
      <div class="container" data-aos="zoom-in" data-aos-delay="100">
        <h1 id="header1"></h1>
        <img id="header2">
        <h2 class="header-text" id="hero-subtitle"></h2>
        <h2 class="header-text" id="countdown"></h2>
        <div class="social-links" id="social-links" style="display: none">
          <a id="attachmentsLink" href="" target="_blank" class="documents"><i class="iconify"
              data-icon="heroicons:paper-clip-20-solid" style="display:none"></i></a>
          <a id="driveLink" href="" target="_blank" class="documents"><i class="iconify"
              data-icon="fa-brands:google-drive" style="display:none"></i></a>
          <a id="sheetLink" href="" target="_blank" class="sheets"><i class="iconify"
              data-icon="file-icons:microsoft-excel" style="display:none"></i></a>
          <a id="pptLink" href="" target="_blank" class="sheets"><i class="iconify"
              data-icon="file-icons:microsoft-powerpoint" style="display:none"></i></a>
          <a id="pdfLink" href="" target="_blank" class="sheets"><i class="iconify" data-icon="fa6-solid:file-pdf"
              style="display:none"></i></a>
          <a id="mapsLink" href="" target="_blank" class="sheets"><i class="iconify"
              data-icon="clarity:map-marker-solid" style="display:none"></i></a>
          <a id="vaccineLink" href="" target="_blank" class="sheets"><i class="iconify" data-icon="tabler:vaccine"
              style="display:none"></i></a>
        </div>
        <button id="todays-itinerary-btn" style="display: none"><span
            data-translate="trip.itinerary.todays_itinerary"></span></button>
      </div>
    </section>

    <main id="main">

      <!-- ======= Keypoints ======= -->
      <section id="keypoints" class="facts">
        <div class="container" data-aos="fade-up">
          <div class="section-title">
            <h2 data-translate="labels.highlights"></h2>
          </div>
          <div class="col-lg-4" id="googleMaps"></div>

          <div class="row" id="keypoints-grid">
            <div class="col-6 col-lg-3">
              <div class="count-box" id="keypoint1">
                <i></i>
                <span> </span>
                <p>...</p>
              </div>
            </div>

            <div class="col-6 col-lg-3">
              <div class="count-box" id="keypoint2">
                <i></i>
                <span> </span>
                <p>...</p>
              </div>
            </div>

            <div class="col-6 col-lg-3">
              <div class="count-box" id="keypoint3">
                <i></i>
                <span> </span>
                <p>...</p>
              </div>
            </div>

            <div class="col-6 col-lg-3">
              <div class="count-box" id="keypoint4">
                <i></i>
                <span> </span>
                <p>...</p>
              </div>
            </div>
          </div>
      </section>

      <section id="expenses" class="about">
        <div class="container" data-aos="fade-up">
          <div class="section-title">
            <h2 data-translate="trip.expenses.title"></h2>
          </div>

          <div id="expenses-embed">
            <iframe id="expenses-embed-frame"></iframe>
          </div>
        </div>
      </section>

      <!-- ======= Transportation ======= -->
      <section id="transportation" class="about">
        <div class="container" data-aos="fade-up">

          <div class="section-title">
            <h2 id="transportation-title" data-translate="trip.transportation.title"></h2>
          </div>

          <div class="custom-select" id="transportation-select" style="display: none;"></div>

          <div class="tabs-container" id="tabs-container-transportation" style="display: none">
            <div class="tabs" id="tab-transportation">
            </div>
          </div>

          <div id="transportation-box-container">
            <div class='transporte-box' id="transportation-outbound">
              <div id="transportation-outbound-content"></div>
            </div>

            <div class='transporte-box' id="transportation-internal" style="display: none;">
              <div id="transportation-internal-content"></div>
            </div>

            <div class='transporte-box' id="transportation-return" style="display: none;">
              <div id="transportation-return-content"></div>
            </div>

            <div id="transportation-custom-container"></div>
          </div>

        </div>
      </section>

      <!-- ======= Stay ======= -->
      <section id="stay" class="about">
        <div class="container" data-aos="fade-up">

          <div class="section-title">
            <h2 data-translate="trip.accommodation.title"></h2>
            <div id="accommodation-about"></div>
          </div>

          <div id="accommodations-box"></div>

        </div>
      </section>

      <!-- ======= Itinerary Calendar ======= -->
      <section id="scheduleCalendar" class="itinerary resume">
        <div class="container" data-aos="fade-up">

          <div class="section-title">
            <h2 data-translate="trip.itinerary.title"></h2>
            <div id="itinerary-description" data-translate="trip.itinerary.instructions"></div>
            <div id="itinerary-total"></div>
            <div id="itinerary-adjustment"></div>
            <div class="backup" id="backupData"></div>

            <div id="pill-box" class="pill-box" style="display: none;"></div>

            <div class="card" id="calendar-table-card">
              <h3 class="card-header" id="calendarTitle"></h3>
              <table class="table table-bordered table-responsive-sm" id="calendar">
                <thead id="calendar-table-header">
                  <tr>
                    <th data-translate="datetime.weekdays.mini.sunday"></th>
                    <th data-translate="datetime.weekdays.mini.monday"></th>
                    <th data-translate="datetime.weekdays.mini.tuesday"></th>
                    <th data-translate="datetime.weekdays.mini.wednesday"></th>
                    <th data-translate="datetime.weekdays.mini.thursday"></th>
                    <th data-translate="datetime.weekdays.mini.friday"></th>
                    <th data-translate="datetime.weekdays.mini.saturday"></th>
                  </tr>
                </thead>

                <tbody id="calendar-body">

                </tbody>
              </table>

              <div id="calendarMonthSelector" class="form-inline" style="display: none;">
                <button class="calendar-navigation" id="previous" onclick="_calendarPrevious()"><i
                    class="bx bx-left-arrow-alt"></i></button>
                <button class="calendar-navigation" id="next" onclick="_calendarNext()"><i
                    class="bx bx-right-arrow-alt"></i></button>
              </div>
              <br />
            </div>

            <div id="programacao-box">
              <div id="programacao-modal">
                <div id="programacao-fechar" onclick="_closeModalCalendar()"><i class="iconify"
                    data-icon="material-symbols:close"></i></div>

                <div class="programacao-titulo-box">
                  <div class="programacao-linha">
                    <div id="programacao-titulo">
                      <div class="titulo"></div>
                      <div id="innner-programacao-travelers-checkboxes" class="checkboxes-container"
                        style="display: none"></div>
                    </div>
                  </div>
                  <div class="programacao-data-box">
                    <i class="bx bx-calendar color-icon"></i>
                    <span id="programacao-data"></span>
                  </div>
                </div>

                <div id="sem-programacao" data-translate="trip.itinerary.no_itinerary"></div>

                <div class="programacao-item" id="programacao-madrugada"
                  data-translate="datetime.time_of_day.early_hours"></div>
                <div id="programacao-itens-madrugada">
                </div>

                <div class="programacao-item" id="programacao-manha" data-translate="datetime.time_of_day.morning">
                </div>
                <div id="programacao-itens-manha">
                </div>

                <div class="programacao-item" id="programacao-tarde" data-translate="datetime.time_of_day.afternoon">
                </div>
                <div id="programacao-itens-tarde">
                </div>

                <div class="programacao-item" id="programacao-noite" data-translate="datetime.time_of_day.evening">
                </div>
                <div id="programacao-itens-noite">
                </div>
              </div>

            </div>

            <div class="button-box" style="margin-top: 25px">
              <button id="full-itinerary" class="btn btn-theme btn-format"><span
                  data-translate="trip.itinerary.full_itinerary"></span>
                </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ======= Destinations ======= -->
      <section id="destinations" class="services">
        <div class="container" data-aos="fade-up">

          <div class="section-title" id="destinationsTitleContainer">
            <h2 id="destinations-title" data-translate="destination.title"></h2>
            <div id="destinations-update"></div>
          </div>

          <div id="destinations-description"></div>

          <div id="destinations-select" class="custom-select"></div>
          </select>

          <div class="row" id="destinationsBox"></div>

        </div>
      </section>

      <!-- ======= Gallery Section ======= -->
      <section id="portfolio" class="portfolio section-bg">
        <div class="container" data-aos="fade-up">

          <div class="section-title">
            <h2 data-translate="trip.gallery.title"></h2>
          </div>

          <div class="row">
            <div class="col-lg-12 d-flex justify-content-center" data-aos="fade-up" data-aos-delay="100">
              <ul id="portfolio-flters">
                <li data-filter="*" class="filter-active" data-translate="labels.all"></li>
              </ul>
            </div>
          </div>

          <div class="row portfolio-container" id="portfolio-container" data-aos="fade-up" data-aos-delay="200"></div>

        </div>
      </section><!-- End Gallery Section -->

      <!-- ======= Support: LightBox ======= -->
      <div id="lightbox" class="lightbox">
        <div id="lightbox-content" class="lightbox-content">
          <iframe id="lightbox-iframe"></iframe>
        </div>
      </div>

    </main>

    <!-- ======= Footer ======= -->
    <footer id="footer">
      <div class="container">
        <div class="credits">
          <span data-translate="labels.developed_by"></span> <a
            href="https://www.linkedin.com/in/gabrielfavero/">Gabriel Fávero</a>. <span class="attributions"
            onclick="_openAttributions()"><i class="bx bx-info-circle"></i>
            <span data-translate="labels.credits"></span></span>
        </div>
      </div>
    </footer>
  </div>

  <!-- ======= Support: Preloader ======= -->
  <div id="preloader"></div>
  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" onclick="_closeToast()">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- #include shared/scripts-vendor.html -->
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <!-- #include shared/scripts-core.html -->
</body>

</html>
