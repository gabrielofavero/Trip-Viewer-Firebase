  <!-- ======= Main Content ======= -->
  <section id="hero" class="loadable" style="display: none">
    <div class="content-box" id="content-box">

      <!-- Unlogged State -->
      <div id="unlogged-view" class="view-panel" style="display: none">
        <div class="hero-brand">
          <div class="hero-wordmark">TripViewer</div>
        </div>
        <div class="login-box" id="login-box">
          <div class="login-input">
            <input type="email" id="login-email" class="login-item" data-translate="labels.auth.email" required>
          </div>
          <div class="login-input">
            <input type="password" id="login-password" class="login-item" data-translate="labels.auth.password" required>
          </div>
          <button id="login-button" class="btn btn-primary-theme" type="button" data-translate="labels.auth.sign_in"></button>
        </div>
      </div>

      <!-- Logged State: Dashboard -->
      <div id="logged-view" class="view-panel" style="display: none">
        <!-- Greeting -->
        <div class="greeting-section">
          <div class="greeting-avatar" id="greeting-avatar"></div>
          <div class="greeting-text">
            <h2 class="greeting-title"><span data-translate="labels.greeting"></span>, <span id="title-name"></span>!</h2>
            <p class="greeting-subtitle" data-translate="index.welcome_back"></p>
          </div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="category-tabs">
          <button class="category-tab active" data-tab="trips">
            <i class="iconify" data-icon="tabler:plane-departure"></i>
            <span data-translate="index.my_trips"></span>
          </button>
          <button class="category-tab" data-tab="destinations">
            <i class="iconify" data-icon="bx:trip"></i>
            <span data-translate="index.my_destinations"></span>
          </button>
          <button class="category-tab" data-tab="lists">
            <i class="iconify" data-icon="fluent:list-28-filled"></i>
            <span data-translate="index.my_lists"></span>
          </button>
          <button class="category-tab" data-tab="settings">
            <i class="iconify" data-icon="material-symbols:settings"></i>
            <span data-translate="account.settings"></span>
          </button>
        </div>

        <!-- Tab Content: Trips -->
        <div class="tab-content active" id="tab-trips">
          <div class="tab-header">
            <span class="tab-header-count" id="trips-count"></span>
            <button id="new-trip-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="trip.new"></span>
            </button>
          </div>
          <div class="trip-grid" id="trip-grid">
            <!-- Trip cards rendered by JS -->
          </div>
          <div class="empty-state" id="trips-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="tabler:plane-off"></i>
            <p data-translate="index.no_trips"></p>
          </div>
        </div>

        <!-- Tab Content: Destinations -->
        <div class="tab-content" id="tab-destinations">
          <div class="tab-header">
            <span class="tab-header-count" id="dests-count"></span>
            <button id="new-dest-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="destination.new"></span>
            </button>
          </div>
          <div class="dest-grid" id="dest-grid">
            <!-- Destination cards rendered by JS -->
          </div>
          <div class="empty-state" id="dest-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="material-symbols:location-off"></i>
            <p data-translate="index.no_destinations"></p>
          </div>
        </div>

        <!-- Tab Content: Lists -->
        <div class="tab-content" id="tab-lists">
          <div class="tab-header">
            <span class="tab-header-count" id="lists-count"></span>
            <button id="new-list-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="listing.new"></span>
            </button>
          </div>
          <div class="list-grid" id="list-grid">
            <!-- List cards rendered by JS -->
          </div>
          <div class="empty-state" id="lists-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="fluent:list-28-regular"></i>
            <p data-translate="index.no_lists"></p>
          </div>
        </div>

        <!-- Tab Content: Settings -->
        <div class="tab-content" id="tab-settings">
          <div class="settings-panel">
            <!-- Profile Card -->
            <div class="settings-card" id="settings-account-card">
              <div class="settings-avatar" id="settings-avatar"></div>
              <div class="settings-user-info">
                <div class="settings-user-name" id="settings-user-name"></div>
              </div>
              <button class="btn btn-outline-theme" onclick="_signOut()">
                <i class="iconify" data-icon="material-symbols:logout"></i>
                <span data-translate="labels.auth.sign_out"></span>
              </button>
            </div>

            <!-- Advanced Settings -->
            <div class="settings-section">
              <h3 class="settings-section-title" data-translate="labels.advanced"></h3>
              <div class="settings-actions">
                <button class="btn btn-secondary-theme settings-action-btn" onclick="_backupOnClickAction()">
                  <i class="iconify" data-icon="material-symbols:cloud-download"></i>
                  <span data-translate="account.backup.title"></span>
                </button>
                <button class="btn btn-secondary-theme settings-action-btn" onclick="_restoreOnClickAction()">
                  <i class="iconify" data-icon="material-symbols:cloud-upload"></i>
                  <span data-translate="account.restore.title"></span>
                </button>
                <input type="file" id="restore-account-input" accept="application/json" style="display:none">
              </div>
              <div class="settings-danger">
                <a id="settings-delete-account" href="#" onclick="_openModal()" data-translate="account.delete.title"></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Account Modal -->
      <div id="modal" class="modal-overlay">
        <div class="modal-card">
          <div class="modal-header">
            <h4 id="modal-text-title" data-translate="account.delete.title"></h4>
            <a onclick="_closeModal()" class="modal-close-btn">
              <i class="iconify" data-icon="material-symbols:close"></i>
            </a>
          </div>
          <p class="modal-body" data-translate="account.delete.message"></p>
          <div class="modal-actions">
            <button id="cancelar" class="btn btn-outline-theme" type="button" onclick="_closeModal()">
              <span data-translate="labels.cancel"></span>
            </button>
            <button id="apagar" class="btn btn-danger" type="submit">
              <span data-translate="labels.delete"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Trip Detail Dialog -->
      <div id="trip-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image" id="trip-dialog-image"></div>
          <a class="dialog-close" onclick="_closeTripDialog()">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="trip-dialog-title"></h2>
              <span class="dialog-badge" id="trip-dialog-badge"></span>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:calendar-month"></i>
                <span id="trip-dialog-dates"></span>
              </div>
              <div class="dialog-meta-item" id="trip-dialog-duration-row">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="trip-dialog-duration"></span>
              </div>
              <div class="dialog-meta-item" id="trip-dialog-dest-row">
                <i class="iconify" data-icon="material-symbols:location-on"></i>
                <span id="trip-dialog-dests"></span>
              </div>
            </div>
            <div class="dialog-modules" id="trip-dialog-modules"></div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="trip-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="trip-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Destination Detail Dialog -->
      <div id="dest-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image no-image">
            <i class="iconify dialog-image-icon" data-icon="material-symbols:location-on"></i>
          </div>
          <a class="dialog-close" onclick="_closeDestDialog()">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="dest-dialog-title"></h2>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item" id="dest-dialog-currency-row">
                <i class="iconify" data-icon="material-symbols:payments"></i>
                <span id="dest-dialog-currency"></span>
              </div>
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="dest-dialog-updated"></span>
              </div>
            </div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="dest-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="dest-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- List Detail Dialog -->
      <div id="list-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image" id="list-dialog-image"></div>
          <a class="dialog-close" onclick="_closeListDialog()">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="list-dialog-title"></h2>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item" id="list-dialog-subtitle-row">
                <i class="iconify" data-icon="material-symbols:info"></i>
                <span id="list-dialog-subtitle"></span>
              </div>
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="list-dialog-updated"></span>
              </div>
            </div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="list-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="list-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
