<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link data-main href="assets/css/index/index.css" rel="stylesheet">

</head>

<body>
  <!-- #include shared/top-bar.html -->

  <!-- ======= Notification Bar (removed - no longer needed) ======= -->
  <!-- ======= Notification Bar (removed) ======= -->

  <!-- ======= Main Content ======= -->
  <section id="hero" class="loadable" style="display: none">
    <div class="content-box" id="content-box">

      <!-- Unlogged State -->
      <div id="unlogged-view" class="view-panel" style="display: none">
        <div class="hero-brand">
          <div class="hero-wordmark">TripViewer</div>
        </div>
        <div class="login-box" id="login-box">
          <div class="login-input">
            <input type="email" id="login-email" class="login-item" data-translate="labels.auth.email" required>
          </div>
          <div class="login-input">
            <input type="password" id="login-password" class="login-item" data-translate="labels.auth.password" required>
          </div>
          <button id="login-button" class="btn btn-primary-theme" type="button" data-translate="labels.auth.sign_in"></button>
        </div>
      </div>

      <!-- Logged State: Dashboard -->
      <div id="logged-view" class="view-panel" style="display: none">
        <!-- Greeting / Account Bar -->
        <div class="greeting-section" id="greeting-section">
          <div class="greeting-content" id="greeting-content">
            <div class="greeting-avatar" id="greeting-avatar"></div>
            <div class="greeting-text">
              <h2 class="greeting-title"><span data-translate="labels.greeting"></span>, <span id="title-name"></span>!</h2>
              <p class="greeting-subtitle" data-translate="index.welcome_back"></p>
            </div>
          </div>
          <div class="greeting-account" id="greeting-account">
            <div class="settings-avatar" id="settings-avatar"></div>
            <div class="settings-user-info">
              <div class="settings-user-name" id="settings-user-name"></div>
              <div class="settings-user-email" id="settings-user-email"></div>
            </div>
            <button class="btn btn-outline-theme" data-action="sign-out">
              <i class="iconify" data-icon="material-symbols:logout"></i>
              <span data-translate="labels.auth.sign_out"></span>
            </button>
          </div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="category-tabs">
          <button class="category-tab active" data-tab="trips">
            <i class="iconify" data-icon="tabler:plane-departure"></i>
            <span class="tab-label" data-translate="index.my_trips"></span>
          </button>
          <button class="category-tab" data-tab="destinations">
            <i class="iconify" data-icon="bx:trip"></i>
            <span class="tab-label" data-translate="index.my_destinations"></span>
          </button>
          <button class="category-tab" data-tab="lists">
            <i class="iconify" data-icon="fluent:list-28-filled"></i>
            <span class="tab-label" data-translate="index.my_lists"></span>
          </button>
          <button class="category-tab" data-tab="settings">
            <i class="iconify" data-icon="material-symbols:settings"></i>
            <span class="tab-label" data-translate="account.settings"></span>
          </button>
        </div>

        <!-- Search Bar -->
        <div class="search-bar" id="search-bar">
          <i class="iconify search-icon" data-icon="material-symbols:search"></i>
          <input type="text" id="search-input" class="search-input" data-translate="index.search_placeholder">
          <button class="search-clear" id="search-clear" style="display:none" aria-label="Clear search">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </button>
        </div>

        <!-- Tab Content: Trips -->
        <div class="tab-content active" id="tab-trips">
          <div class="tab-header">
            <span class="tab-header-count" id="trips-count"></span>
            <button id="new-trip-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="trip.new"></span>
            </button>
          </div>

          <div class="trip-section" id="trip-active-section">
            <h3 class="trip-section-title">
              <span data-translate="index.active_trips"></span>
              <span class="trip-section-count" id="trip-active-count"></span>
            </h3>
            <div class="trip-grid" id="trip-active-grid">
              <!-- Active trip cards rendered by JS -->
            </div>
            <div class="grid-sentinel" id="trip-active-sentinel"></div>
          </div>

          <div class="trip-section" id="trip-upcoming-section">
            <h3 class="trip-section-title">
              <span data-translate="index.upcoming_trips"></span>
              <span class="trip-section-count" id="trip-upcoming-count"></span>
            </h3>
            <div class="trip-grid" id="trip-upcoming-grid">
              <!-- Upcoming trip cards rendered by JS -->
            </div>
            <div class="grid-sentinel" id="trip-upcoming-sentinel"></div>
          </div>

          <div class="trip-section" id="trip-finished-section">
            <h3 class="trip-section-title">
              <span data-translate="index.finished_trips"></span>
              <span class="trip-section-count" id="trip-finished-count"></span>
            </h3>
            <div class="trip-grid" id="trip-finished-grid">
              <!-- Finished trip cards rendered by JS -->
            </div>
            <div class="grid-sentinel" id="trip-finished-sentinel"></div>
          </div>

          <div class="empty-state" id="trips-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="tabler:plane-off"></i>
            <p data-translate="index.no_trips"></p>
          </div>
        </div>

        <!-- Tab Content: Destinations -->
        <div class="tab-content" id="tab-destinations">
          <div class="tab-header">
            <span class="tab-header-count" id="dests-count"></span>
            <button id="new-dest-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="destination.new"></span>
            </button>
          </div>
          <div class="dest-grid" id="dest-grid">
            <!-- Destination cards rendered by JS -->
          </div>
          <div class="grid-sentinel" id="dest-sentinel"></div>
          <div class="empty-state" id="dest-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="material-symbols:location-off"></i>
            <p data-translate="index.no_destinations"></p>
          </div>
        </div>

        <!-- Tab Content: Lists -->
        <div class="tab-content" id="tab-lists">
          <div class="tab-header">
            <span class="tab-header-count" id="lists-count"></span>
            <button id="new-list-btn" class="btn btn-primary-theme btn-sm">
              <i class="iconify" data-icon="gridicons:add-outline"></i>
              <span data-translate="listing.new"></span>
            </button>
          </div>
          <div class="list-grid" id="list-grid">
            <!-- List cards rendered by JS -->
          </div>
          <div class="grid-sentinel" id="list-sentinel"></div>
          <div class="empty-state" id="lists-empty" style="display:none">
            <i class="iconify empty-icon" data-icon="fluent:list-28-regular"></i>
            <p data-translate="index.no_lists"></p>
          </div>
        </div>

        <!-- Tab Content: Settings -->
        <div class="tab-content" id="tab-settings">
          <div class="settings-panel">
            <!-- Advanced Settings -->
            <div class="settings-section">
              <h3 class="settings-section-title" data-translate="labels.advanced"></h3>
              <div class="settings-actions">
                <button class="btn btn-secondary-theme settings-action-btn" data-action="import-documents">
                  <i class="iconify" data-icon="heroicons:document-arrow-down-16-solid"></i>
                  <span data-translate="account.import_documents.title"></span>
                </button>
                <input type="file" id="import-documents-input" accept="application/json" multiple style="display:none">
                <button class="btn btn-secondary-theme settings-action-btn" data-action="export-documents">
                  <i class="iconify" data-icon="heroicons:document-arrow-up-16-solid"></i>
                  <span data-translate="account.export_documents.title"></span>
                </button>
                <button class="btn btn-secondary-theme settings-action-btn" data-action="export-static">
                  <i class="iconify" data-icon="heroicons:globe-alt-16-solid"></i>
                  <span data-translate="account.export_static.title"></span>
                </button>
                <button class="btn btn-secondary-theme settings-action-btn" data-action="restore-account">
                  <i class="iconify" data-icon="mdi:account-arrow-down"></i>
                  <span data-translate="account.restore.title"></span>
                </button>
                <button class="btn btn-secondary-theme settings-action-btn" data-action="backup-account">
                  <i class="iconify" data-icon="mdi:account-arrow-up"></i>
                  <span data-translate="account.backup.title"></span>
                </button>
                <input type="file" id="restore-account-input" accept="application/json" style="display:none">
              </div>
              <div class="settings-danger">
                <a id="settings-delete-account" href="#" data-action="open-delete-modal" data-translate="account.delete.title"></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Account Modal -->
      <div id="modal" class="modal-overlay">
        <div class="modal-card">
          <div class="modal-header">
            <h4 id="modal-text-title" data-translate="account.delete.title"></h4>
            <a data-action="close-delete-modal" class="modal-close-btn">
              <i class="iconify" data-icon="material-symbols:close"></i>
            </a>
          </div>
          <p class="modal-body" data-translate="account.delete.message"></p>
          <div class="modal-actions">
            <button id="cancel-btn" class="btn btn-outline-theme" type="button" data-action="close-delete-modal">
              <span data-translate="labels.cancel"></span>
            </button>
            <button id="delete-btn" class="btn btn-danger" type="submit">
              <span data-translate="labels.delete"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Trip Detail Dialog -->
      <div id="trip-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image" id="trip-dialog-image"></div>
          <a class="dialog-close" data-action="close-trip-dialog">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="trip-dialog-title"></h2>
              <span class="dialog-badge" id="trip-dialog-badge"></span>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:calendar-month"></i>
                <span id="trip-dialog-dates"></span>
              </div>
              <div class="dialog-meta-item" id="trip-dialog-duration-row">
                <i class="iconify" data-icon="material-symbols:timelapse"></i>
                <span id="trip-dialog-duration"></span>
              </div>
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="trip-dialog-updated"></span>
              </div>
            </div>
            <div class="dialog-modules" id="trip-dialog-modules"></div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="trip-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="trip-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Destination Detail Dialog -->
      <div id="dest-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image no-image" id="dest-dialog-image">
            <i class="iconify dialog-image-icon" data-icon="material-symbols:location-on"></i>
          </div>
          <a class="dialog-close" data-action="close-dest-dialog">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="dest-dialog-title"></h2>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item" id="dest-dialog-currency-row">
                <i class="iconify" data-icon="material-symbols:payments"></i>
                <span id="dest-dialog-currency"></span>
              </div>
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="dest-dialog-updated"></span>
              </div>
            </div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="dest-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="dest-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- List Detail Dialog -->
      <div id="list-dialog" class="dialog-overlay" style="display:none">
        <div class="dialog-card">
          <div class="dialog-image" id="list-dialog-image"></div>
          <a class="dialog-close" data-action="close-list-dialog">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </a>
          <div class="dialog-body">
            <div class="dialog-header">
              <h2 class="dialog-title" id="list-dialog-title"></h2>
            </div>
            <div class="dialog-meta">
              <div class="dialog-meta-item" id="list-dialog-subtitle-row">
                <i class="iconify" data-icon="material-symbols:info"></i>
                <span id="list-dialog-subtitle"></span>
              </div>
              <div class="dialog-meta-item">
                <i class="iconify" data-icon="material-symbols:schedule"></i>
                <span id="list-dialog-updated"></span>
              </div>
            </div>
            <div class="dialog-actions">
              <button class="btn btn-primary-theme dialog-action-btn" id="list-dialog-view">
                <i class="iconify" data-icon="fluent:eye-16-regular"></i>
                <span data-translate="labels.view"></span>
              </button>
              <button class="btn btn-outline-theme dialog-action-btn" id="list-dialog-edit">
                <i class="iconify" data-icon="tabler:edit"></i>
                <span data-translate="labels.edit"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ======= Footer ======= -->
  <footer id="footer" class="loadable" style="display: none">
    <div class="container">
      <div class="credits">
        <span class="tripviewer-version"></span> <span data-translate="labels.developed_by"></span> <a href="https://www.linkedin.com/in/gabrielfavero/">Gabriel
          Fávero</a>. <span class="attributions" data-action="open-attributions"><i class="iconify"
            data-icon="ri:information-line"></i>
          <span data-translate="labels.credits"></span></span>
      </div>
    </div>
  </footer>

  <!-- ======= Preloader ======= -->
  <div id="preloader"></div>

  <!-- ======= Toast ======= -->
  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" data-action="close-toast">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- JSZip (index only — used by the static-export flow; never leaks into exports) -->
  <script src="assets/vendor/jszip/jszip.min.js"></script>

  <!-- #include shared/scripts-vendor.html -->
  <!-- #include shared/scripts-core.html -->

  <!-- #include shared/nav-helper.html -->
</body>

</html>
