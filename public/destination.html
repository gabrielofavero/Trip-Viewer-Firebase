<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link data-main href="assets/css/destination/destination.css" rel="stylesheet">

</head>

<body>
  <div class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <div class="section-title">
      <br><br><br><br>
      <h1 id="title"></h1>
      <div class="destinos-select" id="destinos-select"></div>
      <div id="subtitulo-destinos"></div>
    </div>

    <div class="section-buttons" id="filter-sort-container">
      <button class="filter-sort" id="filter" onclick="_openFilterDrawer()">
        <i class="iconify" data-icon="tdesign:filter"></i>
        <span data-translate="destination.filter.title"></span>
      </button>
      <button class="filter-sort" id="sort" onclick="_openSortDrawer()">
        <i class="iconify" data-icon="ant-design:sort-ascending-outlined"></i>
        <span data-translate="destination.sort.title"></span>
      </button>
    </div>

    <div id="content"></div>

    <div class="add-container" style="display: none">
      <button class="edit-btn" id="adicionar" onclick="_add()">
          <i class="iconify user-data-icon" data-icon="gridicons:add-outline"></i>
          <span data-translate="labels.add"></span>
      </button>
    </div>

    <!-- ======= Footer ======= -->
    <footer id="footer">
      <div class="container">
        <div class="credits">
          <span data-translate="labels.developed_by"></span> <a
            href="https://www.linkedin.com/in/gabrielfavero/">Gabriel Fávero</a>. <span class="atribuicoes"
            onclick="_openAtribuicoes()"><i class="bx bx-info-circle"></i>
            <span data-translate="labels.credits"></span></span>
        </div>
      </div>
    </footer>
  </div>

  <div class="drawer-overlay" id="overlay" onclick="_closeDrawer()">
    <div class="drawer" id="drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <span id="drawerTitle"></span>
        <button class="close-btn" onclick="_closeDrawer()">✕</button>
      </div>
      <div class="drawer-body" id="drawerContent"></div>
    </div>
  </div>

  <div id="preloader" style="display: none"></div>

  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" onclick="_closeToast()">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- #include shared/scripts-vendor.html -->
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script async src="//www.instagram.com/embed.js"></script>
  <!-- #include shared/scripts-core.html -->

</body>

</html>
