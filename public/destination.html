<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link data-main href="assets/css/destination/destination.css" rel="stylesheet">

</head>

<body>
  <div class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <!-- ======= Hero (index-like background + frosted content box) ======= -->
    <section id="hero">
      <div class="content-box" id="destination-content-box">

        <!-- #include shared/destination-content.html -->

      </div>
    </section>

    <!-- ======= Footer ======= -->
    <footer id="footer">
      <div class="container">
        <div class="credits">
          <span class="tripviewer-version"></span> <span data-translate="labels.developed_by"></span> <a
            href="https://www.linkedin.com/in/gabrielfavero/">Gabriel Fávero</a>. <span class="attributions"
            data-action="open-attributions"><i class="bx bx-info-circle"></i>
            <span data-translate="labels.credits"></span></span>
        </div>
      </div>
    </footer>
  </div>

  <div class="drawer-overlay" id="overlay" data-action="close-drawer" style="display: none">
    <div class="drawer" id="drawer" data-stop-propagation>
      <div class="drawer-header">
        <span id="drawerTitle"></span>
        <button class="close-btn" data-action="close-drawer">✕</button>
      </div>
      <div class="drawer-body" id="drawerContent"></div>
    </div>
  </div>

  <!-- Destination Detail Dialog (index-like: click a card → dialog) -->
  <div id="destination-dialog" class="dialog-overlay" style="display:none">
    <div class="dialog-card destination-dialog-card">
      <div class="dialog-media" id="destination-dialog-media"></div>
      <!-- Owner-only pencil, shown dynamically next to the close button -->
      <button class="dialog-edit-btn" id="destination-dialog-edit" data-action="edit-destination" style="display:none">
        <i class="iconify" data-icon="tabler:edit"></i>
      </button>
      <a class="dialog-close" data-action="close-destination-dialog">
        <i class="iconify" data-icon="material-symbols:close"></i>
      </a>
      <div class="dialog-body">
        <div class="dialog-header">
          <div class="dialog-title-row">
            <h2 class="dialog-title" id="destination-dialog-title"></h2>
          </div>
          <span class="dialog-score-badge" id="destination-dialog-score" style="display:none"></span>
        </div>
        <div id="destination-dialog-content"></div>
      </div>
    </div>
  </div>

  <div id="preloader" style="display: none"></div>

  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" data-action="close-toast">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- #include shared/scripts-vendor.html -->
  <!-- #include shared/scripts-core.html -->

  <!-- #include shared/nav-helper.html -->
</body>

</html>
