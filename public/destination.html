<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link data-main href="assets/css/destination/destination.css" rel="stylesheet">

</head>

<body>
  <div class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <!-- ======= Hero (index-like background + frosted content box) ======= -->
    <section id="hero">
      <div class="content-box" id="destination-content-box">

        <div class="section-title">
          <h1 id="title"></h1>
          <div id="destinations-subtitle"></div>
        </div>

        <!-- Category selector — legacy custom select, replaced by the tab bar in P2 -->
        <div class="destinations-select" id="destinations-select"></div>

        <!-- Category tab bar — rendered by JS in P2, hidden until wired -->
        <div class="edit-tab-bar" id="destination-tab-bar" style="display: none"></div>

        <!-- Search bar — wired to the lazy grid in P2 -->
        <div class="search-bar" id="destination-search-bar">
          <i class="iconify search-icon" data-icon="material-symbols:search"></i>
          <input type="text" id="destination-search-input" class="search-input" data-translate="index.search_placeholder">
          <button class="search-clear" id="destination-search-clear" style="display: none" aria-label="Clear search">
            <i class="iconify" data-icon="material-symbols:close"></i>
          </button>
        </div>

        <div class="section-buttons" id="filter-sort-container">
          <button class="filter-sort" id="filter" data-action="open-filter-drawer">
            <i class="iconify" data-icon="tdesign:filter"></i>
            <span data-translate="destination.filter.title"></span>
          </button>
          <button class="filter-sort" id="sort" data-action="open-sort-drawer">
            <i class="iconify" data-icon="ant-design:sort-ascending-outlined"></i>
            <span data-translate="destination.sort.title"></span>
          </button>
        </div>

        <div id="content"></div>
        <div class="grid-sentinel" id="destinations-grid-sentinel"></div>

        <div class="add-container" style="display: none">
          <button class="edit-btn" id="add-button" data-action="add-destination">
              <i class="iconify user-data-icon" data-icon="gridicons:add-outline"></i>
              <span data-translate="labels.add"></span>
          </button>
        </div>

      </div>
    </section>

    <!-- ======= Footer ======= -->
    <footer id="footer">
      <div class="container">
        <div class="credits">
          <span class="tripviewer-version"></span> <span data-translate="labels.developed_by"></span> <a
            href="https://www.linkedin.com/in/gabrielfavero/">Gabriel Fávero</a>. <span class="attributions"
            data-action="open-attributions"><i class="bx bx-info-circle"></i>
            <span data-translate="labels.credits"></span></span>
        </div>
      </div>
    </footer>
  </div>

  <div class="drawer-overlay" id="overlay" data-action="close-drawer" style="display: none">
    <div class="drawer" id="drawer" data-stop-propagation>
      <div class="drawer-header">
        <span id="drawerTitle"></span>
        <button class="close-btn" data-action="close-drawer">✕</button>
      </div>
      <div class="drawer-body" id="drawerContent"></div>
    </div>
  </div>

  <div id="preloader" style="display: none"></div>

  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" data-action="close-toast">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <!-- #include shared/scripts-vendor.html -->
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script async src="//www.instagram.com/embed.js"></script>
  <!-- #include shared/scripts-core.html -->

  <!-- #include shared/nav-helper.html -->
</body>

</html>
