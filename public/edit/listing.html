<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="../assets/css/main.css" rel="stylesheet">
  <link data-main href="../assets/css/edit/edit.css" rel="stylesheet">

</head>

<body>
  <!-- ======= Hero ======= -->
  <section id="hero" class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <div class="demo-page">
      <div class="edit-tab-bar" id="edit-tab-bar">
        <button class="edit-tab active" data-tab="dados-basicos">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span data-translate="labels.basic_information"></span>
        </button>
        <button class="edit-tab" data-tab="customizacao">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span data-translate="labels.customization.title"></span>
        </button>
        <button class="edit-tab" data-tab="destinos">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16"><path fill="currentColor" d="m12.596 11.596l-3.535 3.536a1.5 1.5 0 0 1-2.122 0l-3.535-3.536a6.5 6.5 0 1 1 9.192-9.193a6.5 6.5 0 0 1 0 9.193Zm-1.06-8.132v-.001a5 5 0 1 0-7.072 7.072L8 14.07l3.536-3.534a5 5 0 0 0 0-7.072ZM8 9a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 9Z"/></svg>
          <span data-translate="destination.title"></span>
        </button>
        <button class="edit-tab save-tab" data-tab="double-buttons">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M5 21h14a2 2 0 0 0 2-2V8l-5-5H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2zM7 5h4v2h2V5h2v4H7V5zm0 8h10v6H7v-6z"/></svg>
          <span data-translate="labels.save"></span>
        </button>
      </div>

      <main class="demo-page-content">
        <section data-category="dados-basicos">
          <div class="href-target" id="dados-basicos"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-tool">
              <path
                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
            </svg>
            <span data-translate="labels.basic_information"></span>
          </h1>

          <p data-translate="listing.basic_information"></p>

          <div class="nice-form-group">
            <label data-translate="labels.title"></label>
            <input required id="titulo" type="text" data-translate="listing.title_placeholder" />
          </div>

          <div class="nice-form-group">
            <label><span data-translate="labels.subtitle"></span> <span class="opcional">(<span
                  data-translate="labels.optional"></span>)</span></label>
            <input id="subtitulo" type="text" data-translate="listing.subtitle_placeholder" />
          </div>

          <div class="nice-form-group">
            <label><span data-translate="labels.description.title"></span> <span class="opcional">(<span
                  data-translate="labels.optional"></span>)</span></label>
            <textarea id="descricao" rows="3" data-translate="listing.description_placeholder"></textarea>
          </div>

          <div class="nice-form-group">
            <input id="exibir-em-destinos" type="checkbox" class="switch" checked="">
            <label id="exibir-em-destinos-label" for="exibir-em-destinos">
              <span data-translate="listing.last_update.title"></span>
              <small data-translate="listing.last_update.description"></small>
            </label>
          </div>

          <div id="delete-text" style="display: none;">
            <a href="#" data-action="delete-listing" data-translate="labels.delete"></a>
          </div>

        </section>

        <section data-category="customizacao">
          <div class="href-target" id="customizacao"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-sliders">
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
            <span data-translate="labels.customization.title"></span>
          </h1>
          <p data-translate="listing.customization.subtitle"></p>


          <div class="nice-form-group">
            <input id="habilitado-imagens" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.images.title"></span>
              <small data-translate="labels.customization.images.subtitle"></small>
            </label>
          </div>

          <div class="transparent-background" id="habilitado-imagens-content">

            <div class="nice-form-group customization-box" id="background-box">
              <label><span data-translate="labels.wallpaper"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="upload-background" class="imagem-uploadbox" type="file" accept=".jpg, .jpeg, .png" />
              <p id="upload-background-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-background" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <fieldset class="nice-form-group imagem-checkbox" id="upload-checkbox-background">
              <div class="nice-form-group">
                <input type="radio" name="type-background" id="enable-link-background" checked>
                <label for="enable-link-background" data-translate="labels.image.link"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" name="type-background" id="enable-upload-background">
                <label for="enable-upload-background"><span data-translate="labels.image.upload"></span> <span
                    class="opcional"> (<span data-translate="labels.image.upload_limit"></span>)</span>
              </div>
            </fieldset>

            <div class="nice-form-group customization-box">
              <label>T<span data-translate="labels.customization.images.logo_light"></span> <span
                  class="opcional">(<span data-translate="labels.optional"></span>)</span></label>
              <input id="upload-logo-light" type="file" accept=".png" />
              <p id="upload-logo-light-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-logo-light" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <div class="nice-form-group customization-box">
              <label><span data-translate="labels.customization.images.logo_dark"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="upload-logo-dark" class="imagem-uploadbox" type="file" accept=".png" />
              <p id="upload-logo-dark-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-logo-dark" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <fieldset class="nice-form-group imagem-checkbox" id="upload-checkbox-logo">
              <div class="nice-form-group">
                <input type="radio" name="type-logo" id="enable-link-logo" checked>
                <label for="enable-link-logo" data-translate="labels.image.link"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" name="type-logo" id="enable-upload-logo">
                <label for="enable-upload-logo"><span data-translate="labels.image.upload"></span> <span
                    class="opcional">(<span data-translate="labels.image.upload_limit"></span>)</span></label>
              </div>
            </fieldset>
          </div>

          <div class="nice-form-group">
            <input id="habilitado-cores" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.colors.title"></span>
              <small data-translate="listing.customization.colors"></small>
            </label>
          </div>

          <div class="transparent-background-color" id="habilitado-cores-content">

            <fieldset class="nice-form-group">
              <div class="nice-form-group">
                <input type="radio" id="dark-and-light" name="display-mode" checked />
                <label for="dark-and-light" data-translate="labels.customization.colors.themes.light_and_dark"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" id="light-exclusive" name="display-mode" />
                <label for="light-exclusive" data-translate="labels.customization.colors.themes.light"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" id="dark-exclusive" name="display-mode" />
                <label for="dark-exclusive" data-translate="labels.customization.colors.themes.dark"></label>
              </div>
            </fieldset>

            <div class="side-by-side-color-box" id="cores">
              <div class="nice-form-group side-by-side-color" id="tema-claro">
                <label data-translate="labels.light_mode"></label>
                <input id="claro" type="color" value="#5859a7" />
              </div>

              <div class="nice-form-group side-by-side-color" id="tema-escuro">
                <label data-translate="labels.dark_mode"></label>
                <input id="escuro" type="color" value="#7f75b6" />
              </div>
            </div>
          </div>

          <div class="nice-form-group">
            <input id="habilitado-links" style="margin-top: 0px;" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.links.title"></span>
              <small data-translate="listing.customization.links"></small>
            </label>
          </div>

          <div class="transparent-background" id="habilitado-links-content">
            <div class="nice-form-group" style="margin-top: 10px;">
              <label><span data-translate="labels.customization.links.attachment"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-attachments" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.google_drive"></span> <span
                  class="opcional">(<span data-translate="labels.optional"></span>)</span></label>
              <input id="link-drive" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.map"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-maps" type="url" placeholder="https://www.google.com/maps/" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.pdf"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-pdf" type="url" placeholder="https://drive.google.com/drive" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.presentation"></span> <span
                  class="opcional">(<span data-translate="labels.optional"></span>)</span></label>
              <input id="link-ppt" type="url" placeholder="https://drive.google.com/drive" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.sheet"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-sheet" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.vaccination"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-vacina" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

          </div>

        </section>

        <section data-category="destinos">
          <div class="href-target" id="destinos"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
              <path fill="currentColor"
                d="m12.596 11.596l-3.535 3.536a1.5 1.5 0 0 1-2.122 0l-3.535-3.536a6.5 6.5 0 1 1 9.192-9.193a6.5 6.5 0 0 1 0 9.193Zm-1.06-8.132v-.001a5 5 0 1 0-7.072 7.072L8 14.07l3.536-3.534a5 5 0 0 0 0-7.072ZM8 9a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 9Z">
              </path>
            </svg>
            <span data-translate="destination.title"></span>
          </h1>
          <p data-translate="destination.subtitle"></p>

          <div id="habilitado-destinos-content">
            <div class="nice-form-group" id="sem-destinos">
              <input type="text" readonly data-translate="destination.nothing" />
            </div>
            <div id="com-destinos" style="display: none">
              <div class="nice-form-group">
                <input type="search" id="destinos-search" data-translate="labels.search" value="">
              </div>
              <fieldset class="nice-form-group destinos-checkboxes" id="destinos-checkboxes"></fieldset>
            </div>
            <div id="todos-destinos-utilizados" class="message-text"> <i class='red'>*</i> <span
                data-translate="destination.all_used"></span></div>
          </div>
        </section>

        <section data-category="double-buttons" id="double-button-section">
          <div class="href-target" id="double-buttons"></div>
          <div class="button-box">
            <button id="cancel-btn" class="btn btn-secondary" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M19 5.41L17.59 4L12 9.59L6.41 4L5 5.41L10.59 11L5 16.59L6.41 18L12 12.41L17.59 18L19 16.59L13.41 11L19 5.41Z">
                </path>
              </svg>
              <span data-translate="labels.cancel"></span>
            </button>
            <button id="save-btn" class="btn btn-theme" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                  <path fill="currentColor"
                    d="M5 21h14a2 2 0 0 0 2-2V8l-5-5H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2zM7 5h4v2h2V5h2v4H7V5zm0 8h10v6H7v-6z">
                  </path>
                </svg>
                <span data-translate="labels.save"></span>
              </button>
          </div>
        </section>
        <section id="footer">
          <span data-translate="labels.developed_by"></span> <a
            href="https://www.linkedin.com/in/gabrielfavero/">Gabriel Fávero</a>. <span class="attributions"
            data-action="open-attributions"><i class="iconify" data-icon="ri:information-line"></i>
            <span data-translate="labels.credits"></span></span>
        </section>
      </main>
    </div>
  </section>

  <!-- ======= Support: Modal ======= -->
  <div id="modal" class="modal loadable" style="display: none">
    <div class="modal-content">
      <div class="modal-text">
        <p id="modal-inner-text"></p>
      </div>

      <div class="button-box">
        <button id="re-editar" class="btn btn-basic btn-format" type="button" data-action="close-modal" data-modal="delete-modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M3 17.46v3.04c0 .28.22.5.5.5h3.04c.13 0 .26-.05.35-.15L17.81 9.94l-3.75-3.75L3.15 17.1c-.1.1-.15.22-.15.36M20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83l3.75 3.75z">
            </path>
          </svg>
          <span data-translate="labels.edit"></span>
        </button><button id="home" class="btn btn-secondary btn-format" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9M6 10l6-6l6 6M6 10l-2 2m14-2l2 2m-10 1h4v4h-4v-4z"></path>
          </svg>
          <span data-translate="labels.home"></span>
        </button>
        </button><button id="visualizar" class="btn btn-theme btn-format" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
            <path fill="currentColor"
              d="M2.984 8.625v.003a.5.5 0 0 1-.612.355c-.431-.114-.355-.611-.355-.611l.018-.062s.026-.084.047-.145a6.7 6.7 0 0 1 1.117-1.982C4.096 5.089 5.605 4 8 4s3.904 1.089 4.802 2.183a6.7 6.7 0 0 1 1.117 1.982a4.077 4.077 0 0 1 .06.187l.003.013v.004l.001.002a.5.5 0 0 1-.966.258l-.001-.004l-.008-.025a4.872 4.872 0 0 0-.2-.52a5.696 5.696 0 0 0-.78-1.263C11.286 5.912 10.044 5 8 5c-2.044 0-3.285.912-4.028 1.817a5.7 5.7 0 0 0-.945 1.674a3.018 3.018 0 0 0-.035.109zM8 7a2.5 2.5 0 1 0 0 5a2.5 2.5 0 0 0 0-5M6.5 9.5a1.5 1.5 0 1 1 3 0a1.5 1.5 0 0 1-3 0">
            </path>
          </svg>
          <span data-translate="labels.view"></span>
        </button>
      </div>

    </div>
  </div>

  <!-- ======= Support: Preloader ======= -->
  <div id="preloader"></div>
  <div id="toast" style="display: none">
    <span id="toast-text"></span>
    <span class="toast-close" data-action="close-toast">
      <i class="iconify" data-icon="material-symbols:close"></i>
    </span>
  </div>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <!-- #include shared/scripts-vendor.html -->
  <!-- #include shared/scripts-core.html -->

</body>

</html>
