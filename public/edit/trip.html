<!DOCTYPE html>
<html lang="en">

<head>
  <!-- #include shared/head.html -->
  <link href="../assets/css/main.css" rel="stylesheet">
  <link data-main href="../assets/css/edit/edit.css" rel="stylesheet">

</head>

<body>
  <!-- ======= Hero ======= -->
  <section id="hero" class="loadable" style="display: none">
      <!-- #include shared/top-bar.html -->

    <div class="edit-page">
      <div class="edit-tab-bar" id="edit-tab-bar">
        <button class="edit-tab active" data-tab="dados-basicos">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span data-translate="labels.basic_information"></span>
        </button>
        <button class="edit-tab" data-tab="customizacao">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span data-translate="labels.customization.title"></span>
        </button>
        <button class="edit-tab" data-tab="gastos">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M11.025 21v-2.15q-1.325-.3-2.287-1.15t-1.413-2.4l1.85-.75q.375 1.2 1.113 1.825t1.937.625q1.025 0 1.738-.462t.712-1.438q0-.875-.55-1.387t-2.55-1.163q-2.15-.675-2.95-1.612t-.8-2.288q0-1.625 1.05-2.525t2.15-1.025V3h2v2.1q1.25.2 2.063.913t1.187 1.737l-1.85.8q-.3-.8-.85-1.2t-1.5-.4q-1.1 0-1.675.488T9.825 8.65q0 .825.75 1.3t2.6 1q1.725.5 2.613 1.588t.887 2.512q0 1.775-1.05 2.7t-2.6 1.15V21z"/></svg>
          <span data-translate="trip.expenses.title"></span>
        </button>
        <button class="edit-tab" data-tab="meios-de-transporte">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3-5a9 9 0 0 0 6-8a3 3 0 0 0-3-3a9 9 0 0 0-8 6a6 6 0 0 0-5 3"/><path d="M7 14a6 6 0 0 0-3 6a6 6 0 0 0 6-3m4-8a1 1 0 1 0 2 0a1 1 0 1 0-2 0"/></g></svg>
          <span data-translate="trip.transportation.title"></span>
        </button>
        <button class="edit-tab" data-tab="hospedagens">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14c1.66 0 3-1.34 3-3S8.66 8 7 8s-3 1.34-3 3s1.34 3 3 3m0-4c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m12-3h-8v8H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4m2 8h-8V9h6c1.1 0 2 .9 2 2Z"/></svg>
          <span data-translate="trip.accommodation.title"></span>
        </button>
        <button class="edit-tab" data-tab="destinos">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16"><path fill="currentColor" d="m12.596 11.596l-3.535 3.536a1.5 1.5 0 0 1-2.122 0l-3.535-3.536a6.5 6.5 0 1 1 9.192-9.193a6.5 6.5 0 0 1 0 9.193Zm-1.06-8.132v-.001a5 5 0 1 0-7.072 7.072L8 14.07l3.536-3.534a5 5 0 0 0 0-7.072ZM8 9a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 9Z"/></svg>
          <span data-translate="destination.title"></span>
        </button>
        <button class="edit-tab" data-tab="programacao">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span data-translate="trip.itinerary.title"></span>
        </button>
        <button class="edit-tab" data-tab="galeria">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M11.024 11.536L10 10l-2 3h9l-3.5-5z"/><circle cx="9.503" cy="7.497" r="1.503" fill="currentColor"/><path fill="currentColor" d="M19 2H6c-1.206 0-3 .799-3 3v14c0 2.201 1.794 3 3 3h15v-2H6.012C5.55 19.988 5 19.806 5 19s.55-.988 1.012-1H21V4c0-1.103-.897-2-2-2m0 14H5V5c0-.806.55-.988 1-1h13z"/></svg>
          <span data-translate="trip.gallery.title"></span>
        </button>
      </div>

      <main class="edit-page-content">
        <section data-category="dados-basicos">
          <div class="href-target" id="dados-basicos"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-tool">
              <path
                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
            </svg>
            <span data-translate="labels.basic_information"></span>
          </h1>

          <p data-translate="trip.basic_information.subtitle"></p>

          <div class="nice-form-group">
            <label data-translate="labels.title"></label>
            <input required id="titulo" type="text" data-translate="trip.basic_information.title_placeholder" />
          </div>

          <div class="nice-form-group">
            <label data-translate="currency.title"></label>
            <select id="moeda" class="editar-select" name="currency">
              <option value="BRL" data-translate="currency.type.BRL"></option>
              <option value="USD" data-translate="currency.type.USD"></option>
              <option value="EUR" data-translate="currency.type.EUR"></option>
              <option value="GBP" data-translate="currency.type.GBP"></option>
              <option value="JPY" data-translate="currency.type.JPY"></option>
              <option value="INR" data-translate="currency.type.INR"></option>
              <option value="RUB" data-translate="currency.type.RUB"></option>
              <option value="CAD" data-translate="currency.type.CAD"></option>
              <option value="AUD" data-translate="currency.type.AUD"></option>
              <option value="CHF" data-translate="currency.type.CHF"></option>
              <option value="SEK" data-translate="currency.type.SEK"></option>
              <option value="NOK" data-translate="currency.type.NOK"></option>
              <option value="DKK" data-translate="currency.type.DKK"></option>
              <option value="NZD" data-translate="currency.type.NZD"></option>
              <option value="MXN" data-translate="currency.type.MXN"></option>
              <option value="ZAR" data-translate="currency.type.ZAR"></option>
              <option value="KRW" data-translate="currency.type.KRW"></option>
              <option value="SGD" data-translate="currency.type.SGD"></option>
              <option value="HKD" data-translate="currency.type.HKD"></option>
              <option value="ILS" data-translate="currency.type.ILS"></option>
              <option value="PLN" data-translate="currency.type.PLN"></option>
              <option value="HUF" data-translate="currency.type.HUF"></option>
              <option value="TWD" data-translate="currency.type.TWD"></option>
              <option value="THB" data-translate="currency.type.THB"></option>
            </select>
          </div>

          <div class="side-by-side-box">
            <div class="nice-form-group side-by-side">
              <label data-translate="labels.start"></label>
              <input class="flex-input" id="inicio" type="date" value="2023-01-22" />
            </div>

            <div class="nice-form-group side-by-side">
              <label data-translate="labels.end"></label>
              <input class="flex-input" id="fim" type="date" value="2023-01-22" />
            </div>
          </div>

          <div class="nice-form-group">
            <label data-translate="trip.travelers.title"></label>
            <button id="travelers-info" class="btn input-botao travelers-input" data-action="open-travelers-info"
              data-translate="trip.travelers.add"></button>
          </div>

          <fieldset class="nice-form-group">
            <label data-translate="trip.basic_information.security.title"></label>
            <div class="nice-form-group">
              <input type="radio" name="proteger-viagem" id="pin-disabled" />
              <label for="pin-disabled" data-translate="trip.basic_information.security.disabled"></label>
            </div>
            <div class="nice-form-group">
              <input type="radio" name="proteger-viagem" id="pin-sensitive-only" checked />
              <label for="pin-sensitive-only"
                data-translate="trip.basic_information.security.sensitive_only"></span></label>
            </div>
            <div class="nice-form-group">
              <input type="radio" name="proteger-viagem" id="pin-all-data" />
              <label for="pin-all-data" data-translate="trip.basic_information.security.all_data"></span></label>
            </div>
            <div class="nice-form-group" id="pin-container" style="margin-top: 16px">
              <button id="request-pin" class="btn input-botao" data-action="request-pin-expenses"
                data-translate="trip.basic_information.pin.new"></button>
            </div>
          </fieldset>

          <div id="delete-text" style="display: none; margin-top:1em">
            <a href="#" data-action="delete-trip" data-translate="trip.delete.title"></a>
          </div>

        </section>

        <section data-category="customizacao">
          <div class="href-target" id="customizacao"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-sliders">
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
            <span data-translate="labels.customization.title"></span>
          </h1>
          <p data-translate="trip.customization.subtitle"></p>


          <div class="nice-form-group">
            <input id="habilitado-imagens" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.images.title"></span>
              <small data-translate="labels.customization.images.subtitle"></small>
            </label>
          </div>

          <div class="transparent-background" id="habilitado-imagens-content">

            <div class="nice-form-group customization-box" id="background-box">
              <label><span data-translate="labels.wallpaper"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="upload-background" class="imagem-uploadbox" type="file" accept=".jpg, .jpeg, .png" />
              <p id="upload-background-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-background" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <fieldset class="nice-form-group imagem-checkbox" id="upload-checkbox-background">
              <div class="nice-form-group">
                <input type="radio" name="type-background" id="enable-link-background" checked>
                <label for="enable-link-background" data-translate="labels.image.link"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" name="type-background" id="enable-upload-background">
                <label for="enable-upload-background"><span data-translate="labels.image.upload"></span><span
                    class="opcional"> (<span data-translate="labels.image.upload_limit"></span>)</span></label>
              </div>
            </fieldset>

            <div class="nice-form-group customization-box">
              <label><span data-translate="labels.customization.images.logo_light"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="upload-logo-light" type="file" accept=".png" />
              <p id="upload-logo-light-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-logo-light" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <div class="nice-form-group customization-box">
              <label><span data-translate="labels.customization.images.logo_dark"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="upload-logo-dark" class="imagem-uploadbox" type="file" accept=".png" />
              <p id="upload-logo-dark-size-message" class="message-text"> <i class='red'>*</i> <span
                  data-translate="labels.image.upload_limit"></span></p>
            </div>

            <div class="nice-form-group">
              <input id="link-logo-dark" class="imagem-input" type="url" data-translate="labels.image.placeholder"
                value="" class="icon-right">
            </div>

            <fieldset class="nice-form-group imagem-checkbox" id="upload-checkbox-logo">
              <div class="nice-form-group">
                <input type="radio" name="type-logo" id="enable-link-logo" checked>
                <label for="enable-link-logo" data-translate="labels.image.link"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" name="type-logo" id="enable-upload-logo">
                <label for="enable-upload-logo"><span data-translate="labels.image.upload"></span> <span
                    class="opcional">(<span data-translate="labels.image.upload_limit"></span>)</span></label>
              </div>
            </fieldset>
          </div>

          <div class="nice-form-group">
            <input id="habilitado-cores" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.colors.title"></span>
              <small data-translate="trip.customization.colors"></small>
            </label>
          </div>

          <div class="transparent-background-color" id="habilitado-cores-content">

            <fieldset class="nice-form-group">
              <div class="nice-form-group">
                <input type="radio" id="dark-and-light" name="display-mode" checked />
                <label for="dark-and-light" data-translate="labels.customization.colors.themes.light_and_dark"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" id="light-exclusive" name="display-mode" />
                <label for="light-exclusive" data-translate="labels.customization.colors.themes.light"></label>
              </div>

              <div class="nice-form-group">
                <input type="radio" id="dark-exclusive" name="display-mode" />
                <label for="dark-exclusive" data-translate="labels.customization.colors.themes.dark"></label>
              </div>
            </fieldset>

            <div class="side-by-side-color-box" id="cores">
              <div class="nice-form-group side-by-side-fixed" id="tema-claro">
                <label data-translate="labels.light_mode"></label>
                <input id="claro" type="color" value="#5859a7" />
              </div>

              <div class="nice-form-group side-by-side-fixed" id="tema-escuro">
                <label data-translate="labels.dark_mode"></label>
                <input id="escuro" type="color" value="#7f75b6" />
              </div>
            </div>
          </div>

          <div class="nice-form-group">
            <input id="habilitado-links" style="margin-top: 0px;" type="checkbox" id="check-4" class="switch" />
            <label for="check-4">
              <span data-translate="labels.customization.links.title"></span>
              <small data-translate="trip.customization.links"></small>
            </label>
          </div>

          <div class="transparent-background" id="habilitado-links-content">
            <div class="nice-form-group" style="margin-top: 10px;">
              <label><span data-translate="labels.customization.links.attachment"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-attachments" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.google_drive"></span> <span
                  class="opcional">(<span data-translate="labels.optional"></span>)</span></label>
              <input id="link-drive" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.map"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-maps" type="url" placeholder="https://www.google.com/maps/" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.pdf"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-pdf" type="url" placeholder="https://drive.google.com/drive" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.presentation"></span> <span
                  class="opcional">(<span data-translate="labels.optional"></span>)</span></label>
              <input id="link-ppt" type="url" placeholder="https://drive.google.com/drive" value="" class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.sheet"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-sheet" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

            <div class="nice-form-group">
              <label><span data-translate="labels.customization.links.vaccination"></span> <span class="opcional">(<span
                    data-translate="labels.optional"></span>)</span></label>
              <input id="link-vacina" type="url" placeholder="https://drive.google.com/drive" value=""
                class="icon-right">
            </div>

          </div>

        </section>

        <section data-category="gastos">
          <div class="href-target" id="gastos"></div>
          <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M11.025 21v-2.15q-1.325-.3-2.287-1.15t-1.413-2.4l1.85-.75q.375 1.2 1.113 1.825t1.937.625q1.025 0 1.738-.462t.712-1.438q0-.875-.55-1.387t-2.55-1.163q-2.15-.675-2.95-1.612t-.8-2.288q0-1.625 1.05-2.525t2.15-1.025V3h2v2.1q1.25.2 2.063.913t1.187 1.737l-1.85.8q-.3-.8-.85-1.2t-1.5-.4q-1.1 0-1.675.488T9.825 8.65q0 .825.75 1.3t2.6 1q1.725.5 2.613 1.588t.887 2.512q0 1.775-1.05 2.7t-2.6 1.15V21z" />
            </svg>
            <span data-translate="trip.expenses.title"></span>
          </h1>
          <p data-translate="trip.expenses.subtitle"></p>

          <div class="nice-form-group">
            <input id="habilitado-gastos" type="checkbox" class="switch" />
            <label for="habilitado-gastos" data-translate="labels.enabled"></label>
          </div>

          <div id="habilitado-gastos-content">
            <div class="item-box accordion gastos-box" id="gastos-box">
              <div id="programacao-gastosPrevios" class="accordion-item accordion-programacao">
                <h2 class="accordion-header" id="heading-programacao-gastosPrevios">
                  <button id="programacao-title-gastosPrevios" class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapse-programacao-gastosPrevios" aria-expanded="false"
                    aria-controls="collapse-programacao-gastosPrevios" data-translate="trip.expenses.pre_trip"></button>
                </h2>
                <div id="collapse-programacao-gastosPrevios" class="accordion-collapse collapse"
                  aria-labelledby="heading-programacao-gastosPrevios" data-bs-parent="#gastos-box" style="">
                  <div class="accordion-body">
                    <div id="gastosPrevios"></div>
                    <div class="button-box-right" id="gasto-adicionar-box-gastosPrevios"
                      style="display: block; margin-top: 24px">
                      <button id="programacao-adicionar-gastosPrevios" class="btn btn-theme"
                        data-action="open-inner-expense" data-category="gastosPrevios">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                          <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
                            <path
                              d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12Zm10-8a8 8 0 1 0 0 16a8 8 0 0 0 0-16Z">
                            </path>
                            <path d="M13 7a1 1 0 1 0-2 0v4H7a1 1 0 1 0 0 2h4v4a1 1 0 1 0 2 0v-4h4a1 1 0 1 0 0-2h-4V7Z">
                            </path>
                          </g>
                        </svg>
                        <span data-translate="labels.add"></span>
                      </button>
                    </div>

                  </div>
                </div>
              </div>

              <div id="programacao-gastosDurante" class="accordion-item accordion-programacao">
                <h2 class="accordion-header" id="heading-programacao-gastosDurante">
                  <button id="programacao-title-gastosDurante" class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapse-programacao-gastosDurante" aria-expanded="false"
                    aria-controls="collapse-programacao-gastosDurante"
